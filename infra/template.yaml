AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bingo app — WebSocket API + Lambda + DynamoDB

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref ConnectionsTable
    Tags:
      project: presentation-bingo
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ── DynamoDB ──
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bingo-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: sessionId-index
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: project
          Value: presentation-bingo

  # ── WebSocket API ──
  BingoApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: bingo-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.t"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BingoApi
      StageName: prod
      AutoDeploy: true

  # ── $connect ──
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bingo-connect
      Handler: connect.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BingoApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BingoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations"

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BingoApi}/*/$connect"

  # ── $disconnect ──
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bingo-disconnect
      Handler: disconnect.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BingoApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BingoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations"

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BingoApi}/*/$disconnect"

  # ── $default (handles all messages: ps, getState) ──
  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bingo-message
      Handler: message.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BingoApi}/*"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BingoApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub "integrations/${MessageIntegration}"

  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BingoApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations"

  MessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BingoApi}/*/$default"

  # ── HTTP API (session listing) ──
  BingoHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"

  ListSessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bingo-list-sessions
      Handler: listSessions.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
      Events:
        GetSessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref BingoHttpApi
            Path: /sessions
            Method: GET

Outputs:
  WebSocketUrl:
    Description: WebSocket endpoint for the frontend
    Value: !Sub "wss://${BingoApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  HttpApiUrl:
    Description: HTTP API endpoint for session listing
    Value: !Sub "https://${BingoHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Description: DynamoDB table name
    Value: !Ref ConnectionsTable
